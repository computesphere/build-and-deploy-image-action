name: Build and Deploy Image to ComputeSphere
description: GitHub Action to build and deploy an image to ComputeSphere
author: "ComputeSphere"
branding:
  icon: upload-cloud
  color: blue
inputs:
  mode:
    description: "Specify the action mode: build-only, build-and-push, deploy-only, or build-and-deploy"
    required: true
    default: build-and-deploy
  name:
    description: "Full image name with tag (e.g., quay.io/computesphere/computesphere-nodejs-example:v0.0.1)"
    required: true
  account_id:
    description: "ComputeSphere account ID"
    required: false
  token:
    description: "ComputeSphere API token"
    required: false
  deployment_id:
    description: Deployment ID for ComputeSphere
    required: false
  registry:
    description: Container registry URL
    required: false
  type:
    description: "Image type (private or public)"
    required: false
    default: public
  provider:
    description: Image provider (e.g., other, ecr, gcr)
    required: false
    default: other
  username:
    description: Registry username
    required: false
    default: ''
  password:
    description: Registry password
    required: false
    default: ''
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  extra_build_args:
    description: "Additional build arguments"
    required: false
    default: ''
  pull:
    description: "Pull a fresh copy of every base image on each build (docker build --pull), so floating tags such as node:22-alpine pick up security releases. Recommended: true. Off by default so a Dockerfile that builds FROM an image that exists only in the local Docker cache keeps working"
    required: false
    default: 'false'
  node-version-check:
    description: "After building, check the image's Node.js version against the security floor (images without Node.js are skipped). Warns by default; set to false to skip the check"
    required: false
    default: 'true'
  fail-on-vulnerable-node:
    description: "Fail the build (before push or deploy) when the Node.js version check finds a version below the floor or cannot run. Default false: the check only warns"
    required: false
    default: 'false'
  node-version-floors:
    description: "Override the Node.js floor table: minimum versions, one per release line, separated by spaces or commas (e.g. '22.23.5 24.22.3 26.13.1'). Empty uses the table in scripts/check-node-version.sh"
    required: false
    default: ''
  api_url:
    description: "ComputeSphere API base URL. Leave unset unless ComputeSphere support asks you to change it."
    required: false
    default: "https://api.computesphere.com/v2"

runs:
  using: "composite"
  steps:
    - name: Check Required Inputs
      shell: bash
      run: |
        if [[ "${{ inputs.mode }}" == "deploy-only" && -z "${{ inputs.name }}" ]]; then
          echo "❌ Error: image name is required in deploy-only mode."
          exit 1
        fi

    - name: Validate Dockerfile Path
      shell: bash
      run: |
        DOCKERFILE_PATH="${{ github.workspace }}/${{ inputs.dockerfile }}"
        if [[ ! -f "$DOCKERFILE_PATH" ]]; then
          echo "❌ Error: Dockerfile not found at $DOCKERFILE_PATH"
          exit 1
        fi
        echo "✅ Dockerfile found at: $DOCKERFILE_PATH"

    - name: Docker Login
      if: inputs.mode == 'build-and-push' || inputs.mode == 'build-and-deploy'
      shell: bash
      run: |
        echo "Logging into Docker Registry..."
        echo "${{ inputs.password }}" | docker login "${{ inputs.registry }}" -u "${{ inputs.username }}" --password-stdin

    - name: Build Docker Image
      if: inputs.mode == 'build-only' || inputs.mode == 'build-and-push' || inputs.mode == 'build-and-deploy'
      shell: bash
      run: |
        IMAGE_TAG="${{ inputs.name }}"
        DOCKERFILE_PATH="${{ github.workspace }}/${{ inputs.dockerfile }}"

        PULL_ARGS=()
        if [[ "${{ inputs.pull }}" == "true" ]]; then
          PULL_ARGS=(--pull)
        fi

        echo "Building Docker Image: $IMAGE_TAG"
        if [[ -z "${{ inputs.extra_build_args }}" ]]; then
          docker build "${PULL_ARGS[@]}" -f "$DOCKERFILE_PATH" -t "$IMAGE_TAG" .
        else
          docker build "${PULL_ARGS[@]}" -f "$DOCKERFILE_PATH" -t "$IMAGE_TAG" ${{ inputs.extra_build_args }} .
        fi

    - name: Check Node.js Version
      if: inputs.node-version-check != 'false' && (inputs.mode == 'build-only' || inputs.mode == 'build-and-push' || inputs.mode == 'build-and-deploy')
      shell: bash
      env:
        IMAGE_TAG: ${{ inputs.name }}
        NODE_VERSION_FLOORS: ${{ inputs.node-version-floors }}
        NODE_VERSION_ON_FAIL: ${{ inputs.fail-on-vulnerable-node == 'true' && 'error' || 'warn' }}
      run: bash "$GITHUB_ACTION_PATH/scripts/check-node-version.sh" --image "$IMAGE_TAG"

    - name: Push Docker Image
      if: inputs.mode == 'build-and-push' || inputs.mode == 'build-and-deploy'
      shell: bash
      run: |
        IMAGE_TAG="${{ inputs.name }}"
        echo "Pushing Docker Image: $IMAGE_TAG"
        docker push "$IMAGE_TAG"

    - name: Deploy to ComputeSphere
      if: inputs.mode == 'deploy-only' || inputs.mode == 'build-and-deploy'
      shell: bash
      env:
        CS_API_URL: ${{ inputs.api_url }}
        CS_API_TOKEN: ${{ inputs.token }}
        CS_ACCOUNT_ID: ${{ inputs.account_id }}
        CS_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        CS_IMAGE_NAME: ${{ inputs.name }}
        CS_IMAGE_TYPE: ${{ inputs.type }}
        CS_IMAGE_PROVIDER: ${{ inputs.provider }}
        CS_REGISTRY_URL: ${{ inputs.registry }}
        CS_REGISTRY_USERNAME: ${{ inputs.username }}
        CS_REGISTRY_PASSWORD: ${{ inputs.password }}
        CS_USER_AGENT: computesphere-build-and-deploy-image-action
      run: bash "${{ github.action_path }}/scripts/deploy.sh"
