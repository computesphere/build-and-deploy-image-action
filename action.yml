name: Build and Deploy Image to ComputeSphere
description: GitHub Action to build and deploy an image to ComputeSphere
author: "ComputeSphere"
branding:
  icon: upload-cloud
  color: blue
inputs:
  mode:
    description: "Specify the action mode: build-only, build-and-push, deploy-only, or build-and-deploy"
    required: true
    default: build-and-deploy
  name:
    description: "Full image name with tag (e.g., quay.io/computesphere/computesphere-nodejs-example:v0.0.1)"
    required: true
  account_id:
    description: "ComputeSphere account ID"
    required: false
  token:
    description: "ComputeSphere API token"
    required: false
  deployment_id:
    description: Deployment ID for ComputeSphere
    required: false
  registry:
    description: Container registry URL
    required: false
  type:
    description: "Image type (private or public)"
    required: false
    default: public
  provider:
    description: Image provider (e.g., other, ecr, gcr)
    required: false
    default: other
  username:
    description: Registry username
    required: false
    default: ''
  password:
    description: Registry password
    required: false
    default: ''
  dockerfile:
    description: "Path to Dockerfile"
    required: false
    default: "Dockerfile"
  extra_build_args:
    description: "Additional build arguments"
    required: false
    default: ''
  api_url:
    description: "ComputeSphere API base URL. Leave unset unless ComputeSphere support asks you to change it."
    required: false
    default: "https://api.computesphere.com/v2"

runs:
  using: "composite"
  steps:
    - name: Check Required Inputs
      shell: bash
      run: |
        if [[ "${{ inputs.mode }}" == "deploy-only" && -z "${{ inputs.name }}" ]]; then
          echo "❌ Error: image name is required in deploy-only mode."
          exit 1
        fi

    - name: Validate Dockerfile Path
      shell: bash
      run: |
        DOCKERFILE_PATH="${{ github.workspace }}/${{ inputs.dockerfile }}"
        if [[ ! -f "$DOCKERFILE_PATH" ]]; then
          echo "❌ Error: Dockerfile not found at $DOCKERFILE_PATH"
          exit 1
        fi
        echo "✅ Dockerfile found at: $DOCKERFILE_PATH"

    - name: Docker Login
      if: inputs.mode == 'build-and-push' || inputs.mode == 'build-and-deploy'
      shell: bash
      run: |
        echo "Logging into Docker Registry..."
        echo "${{ inputs.password }}" | docker login "${{ inputs.registry }}" -u "${{ inputs.username }}" --password-stdin

    - name: Build Docker Image
      if: inputs.mode == 'build-only' || inputs.mode == 'build-and-push' || inputs.mode == 'build-and-deploy'
      shell: bash
      run: |
        IMAGE_TAG="${{ inputs.name }}"
        DOCKERFILE_PATH="${{ github.workspace }}/${{ inputs.dockerfile }}"

        echo "Building Docker Image: $IMAGE_TAG"
        if [[ -z "${{ inputs.extra_build_args }}" ]]; then
          docker build -f "$DOCKERFILE_PATH" -t "$IMAGE_TAG" .
        else
          docker build -f "$DOCKERFILE_PATH" -t "$IMAGE_TAG" ${{ inputs.extra_build_args }} .
        fi

    - name: Push Docker Image
      if: inputs.mode == 'build-and-push' || inputs.mode == 'build-and-deploy'
      shell: bash
      run: |
        IMAGE_TAG="${{ inputs.name }}"
        echo "Pushing Docker Image: $IMAGE_TAG"
        docker push "$IMAGE_TAG"

    - name: Deploy to ComputeSphere
      if: inputs.mode == 'deploy-only' || inputs.mode == 'build-and-deploy'
      shell: bash
      env:
        CS_API_URL: ${{ inputs.api_url }}
        CS_API_TOKEN: ${{ inputs.token }}
        CS_ACCOUNT_ID: ${{ inputs.account_id }}
        CS_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
        CS_IMAGE_NAME: ${{ inputs.name }}
        CS_IMAGE_TYPE: ${{ inputs.type }}
        CS_IMAGE_PROVIDER: ${{ inputs.provider }}
        CS_REGISTRY_URL: ${{ inputs.registry }}
        CS_REGISTRY_USERNAME: ${{ inputs.username }}
        CS_REGISTRY_PASSWORD: ${{ inputs.password }}
        CS_USER_AGENT: computesphere-build-and-deploy-image-action
      run: bash "${{ github.action_path }}/scripts/deploy.sh"
